name: Validate plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install PDF dependencies
        run: python -m pip install --disable-pip-version-check reportlab pypdf

      - name: Validate JSON files
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -File -Include *.json | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }

      - name: Validate Python syntax
        run: python -m compileall -q plugins/home-project-control/skills

      - name: Test project utilities
        run: python -m unittest discover -s tests -v

      - name: Validate Claude Code marketplace and plugin
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.234 plugin validate . --strict
          npx --yes @anthropic-ai/claude-code@2.1.234 plugin validate plugins/home-project-control --strict

