<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Форма выбора</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--accent:#2563eb;--muted:#64748b;--border:color-mix(in srgb,CanvasText 16%,transparent);--soft:color-mix(in srgb,CanvasText 5%,transparent)}
    *{box-sizing:border-box}body{margin:0;padding:14px;background:Canvas;color:CanvasText}.shell{max-width:820px;margin:auto}h1{font-size:21px;line-height:1.25;margin:0 0 5px}.lead{margin:0 0 13px;color:var(--muted);font-size:13px}.questions{display:grid;gap:12px}fieldset{margin:0;padding:13px;border:1px solid var(--border);border-radius:14px;background:var(--soft)}legend{padding:0 6px;font-weight:700}.hint{margin:0 0 9px;color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.choice{display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid var(--border);border-radius:10px;background:Canvas;cursor:pointer}.choice:has(input:checked){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,Canvas)}.choice input{margin-top:2px;width:17px;height:17px;accent-color:var(--accent);flex:none}.copy{display:grid;gap:2px}.copy small{color:var(--muted);line-height:1.25}.actions{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border:1px solid var(--border);border-radius:14px;background:Canvas}button{border:0;border-radius:10px;padding:11px 16px;background:var(--accent);color:white;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{font-size:13px;color:var(--muted)}#status.error{color:#dc2626}#status.ok{color:#15803d}.empty{padding:18px;border:1px dashed var(--border);border-radius:12px;color:var(--muted)}@media(max-width:560px){body{padding:10px}.grid{grid-template-columns:1fr}.actions{align-items:flex-start;flex-direction:column}button{width:100%}}
  </style>
</head>
<body>
<main class="shell">
  <h1 id="title">Форма выбора</h1>
  <p id="description" class="lead"></p>
  <form id="form">
    <div id="questions" class="questions"><div class="empty">Загружаю варианты…</div></div>
    <div class="actions"><button id="submit" type="submit">Передать ответы в чат</button><span id="status" role="status" aria-live="polite">Выбор сам по себе не запускает действий.</span></div>
  </form>
</main>
<script>
  const form=document.getElementById("form"),questionsHost=document.getElementById("questions"),button=document.getElementById("submit"),status=document.getElementById("status");
  const pending=new Map();let requestId=1,current=null;
  function rpc(method,params,timeoutMs=8000){const id=requestId++;window.parent.postMessage({jsonrpc:"2.0",id,method,params},"*");return new Promise((resolve,reject)=>{const timer=setTimeout(()=>{pending.delete(id);reject(new Error("Нет ответа от интерфейса чата"))},timeoutMs);pending.set(id,{resolve,reject,timer})})}
  window.addEventListener("message",event=>{if(event.source!==window.parent)return;const message=event.data;if(!message||message.jsonrpc!=="2.0")return;if(message.id!==undefined&&pending.has(message.id)){const item=pending.get(message.id);pending.delete(message.id);clearTimeout(item.timer);message.error?item.reject(message.error):item.resolve(message.result);return}if(message.method==="ui/notifications/tool-result")render(message.params?.structuredContent)},{passive:true});
  function render(data){if(!data||!Array.isArray(data.questions))return;current=data;document.getElementById("title").textContent=data.title||"Форма выбора";const desc=document.getElementById("description");desc.textContent=data.description||"";desc.hidden=!data.description;questionsHost.replaceChildren();for(const question of data.questions){const fieldset=document.createElement("fieldset"),legend=document.createElement("legend");legend.textContent=question.prompt;fieldset.append(legend);if(question.helpText||question.type==="multiple"){const hint=document.createElement("p");hint.className="hint";hint.textContent=question.helpText||(question.type==="multiple"?"Можно выбрать несколько вариантов.":"");fieldset.append(hint)}const grid=document.createElement("div");grid.className="grid";for(const option of question.options){const label=document.createElement("label");label.className="choice";const input=document.createElement("input");input.type=question.type==="multiple"?"checkbox":"radio";input.name=question.id;input.value=option.value;if(question.required&&question.type==="single")input.required=true;const copy=document.createElement("span");copy.className="copy";const main=document.createElement("span");main.textContent=option.label;copy.append(main);if(option.description){const small=document.createElement("small");small.textContent=option.description;copy.append(small)}label.append(input,copy);grid.append(label)}fieldset.append(grid);questionsHost.append(fieldset)}applyPrefill(data.prefill||{})}
  function applyPrefill(prefill){if(!current)return;for(const [name,value] of Object.entries(prefill)){const values=Array.isArray(value)?value:[value];for(const selected of values){const input=form.querySelector(`[name="${CSS.escape(name)}"][value="${CSS.escape(String(selected))}"]`);if(input)input.checked=true}}}
  render(window.openai?.toolOutput);
  function collect(){const data=new FormData(form),answers={};for(const question of current.questions)answers[question.id]=question.type==="multiple"?data.getAll(question.id):(data.get(question.id)||"");return answers}
  async function callSubmit(payload){try{return await rpc("tools/call",{name:"submit_choice_form",arguments:payload})}catch(error){if(window.openai?.callTool)return await window.openai.callTool("submit_choice_form",payload);throw error}}
  async function sendToChat(prompt){try{await rpc("ui/message",{role:"user",content:[{type:"text",text:prompt}]},6000)}catch(error){if(window.openai?.sendFollowUpMessage){await window.openai.sendFollowUpMessage({prompt,scrollToBottom:true});return}throw error}}
  form.addEventListener("submit",async event=>{event.preventDefault();if(!current){status.className="error";status.textContent="Варианты ещё не загружены.";return}if(!form.reportValidity())return;button.disabled=true;status.className="";status.textContent="Проверяю ответы…";try{const payload={formId:current.formId,title:current.title,description:current.description,questions:current.questions,answers:collect()};const checked=await callSubmit(payload);if(checked?.isError||!checked?.structuredContent?.accepted)throw new Error(checked?.content?.[0]?.text||"Ответы не прошли проверку");const answer=checked.structuredContent;window.openai?.setWidgetState?.({modelContent:JSON.stringify(answer.answers),privateContent:{formId:answer.formId}});const prompt=`Я заполнил форму «${current.title}». Используй ответы как подтверждённые мной данные:\n${JSON.stringify(answer.labels,null,2)}\n\n${answer.nextInstruction}`;status.textContent="Передаю ответы в разговор…";await sendToChat(prompt);status.className="ok";status.textContent="Ответы переданы. Продолжаем в чате."}catch(error){status.className="error";status.textContent=`Не удалось передать ответы: ${error?.message||error}`}finally{button.disabled=false}});
</script>
</body>
</html>
